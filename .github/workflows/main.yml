name: Build Test Mitra APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Test Mitra Debug APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v6


      # =========================================================
      # 2. EXTRACT ZIP
      # =========================================================
      - name: Extract Test Mitra ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo ""
          echo "ZIP extracted successfully."

          echo ""
          echo "Top-level files:"
          find extracted -maxdepth 2 -type f | head -100


      # =========================================================
      # 3. FIND REACT/VITE PROJECT
      # =========================================================
      - name: Find Web Project
        shell: bash
        run: |
          set -e

          PACKAGE=$(find extracted -type f -name "package.json" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Test Mitra project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          ls -la "$PROJECT_DIR"


      # =========================================================
      # 4. SETUP NODE.JS
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"


      # =========================================================
      # 5. SETUP JDK 17
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 6. FIX VITE / REACT / TAILWIND COMPATIBILITY
      # =========================================================
      - name: Fix Vite Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Fixing Vite dependency compatibility..."

          npm install \
            vite@7.2.2 \
            @vitejs/plugin-react@5.0.4 \
            @tailwindcss/vite@4.3.3 \
            esbuild@0.27.0 \
            --save-exact \
            --legacy-peer-deps

          echo ""
          echo "Installed versions:"
          npm list \
            vite \
            @vitejs/plugin-react \
            @tailwindcss/vite \
            esbuild \
            --depth=0 || true


      # =========================================================
      # 7. INSTALL ALL NPM DEPENDENCIES
      # =========================================================
      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Installing project dependencies..."

          npm install --legacy-peer-deps

          echo ""
          echo "npm dependencies installed successfully."


      # =========================================================
      # 8. INSTALL CAPACITOR
      # =========================================================
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Installing Capacitor..."

          npm install \
            @capacitor/core@7.4.4 \
            @capacitor/android@7.4.4 \
            --save-exact \
            --legacy-peer-deps

          npm install \
            @capacitor/cli@7.4.4 \
            --save-dev \
            --save-exact \
            --legacy-peer-deps

          echo ""
          echo "Capacitor installed."


      # =========================================================
      # 9. BUILD REACT / VITE APP
      # =========================================================
      - name: Build Web Application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Building Test Mitra Web Application"
          echo "======================================"

          npm run build

          if [ ! -d "dist" ]; then
            echo ""
            echo "ERROR: dist folder was not created."
            exit 1
          fi

          echo ""
          echo "Web build successful."

          echo ""
          echo "Build size:"
          du -sh dist


      # =========================================================
      # 10. CREATE CAPACITOR CONFIGURATION
      # =========================================================
      - name: Create Capacitor Configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f "capacitor.config.ts" ] && \
             [ ! -f "capacitor.config.json" ]; then

            echo "Creating Capacitor configuration..."

            npx cap init \
              "Test Mitra" \
              "com.testmitra.app" \
              --web-dir dist
          else
            echo "Capacitor configuration already exists."
          fi

          echo ""
          echo "Capacitor configuration:"
          ls -la capacitor.config.* 2>/dev/null || true


      # =========================================================
      # 11. ADD ANDROID PLATFORM
      # =========================================================
      - name: Add Android Platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "Creating Android platform..."

            npx cap add android
          else
            echo "Android platform already exists."
          fi


      # =========================================================
      # 12. SYNC CAPACITOR
      # =========================================================
      - name: Sync Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Syncing Test Mitra with Android..."

          npx cap sync android

          echo ""
          echo "Capacitor Android sync completed."


      # =========================================================
      # 13. VERIFY ANDROID PROJECT
      # =========================================================
      - name: Verify Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          if [ ! -f "android/settings.gradle" ] && \
             [ ! -f "android/settings.gradle.kts" ]; then

            echo "ERROR: Android settings.gradle not found."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi

          if [ ! -d "android/app" ]; then
            echo "ERROR: Android app directory not found."
            exit 1
          fi

          echo ""
          echo "Android project verified successfully."


      # =========================================================
      # 14. MAKE GRADLE WRAPPER EXECUTABLE
      # =========================================================
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "Gradle wrapper is ready."


      # =========================================================
      # 15. BUILD DEBUG APK
      # =========================================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Building Test Mitra APK"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Gradle build completed."


      # =========================================================
      # 16. VERIFY APK
      # =========================================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "TEST MITRA APK GENERATED SUCCESSFULLY"
          echo "======================================"

          echo ""
          echo "APK:"
          echo "$APK"

          echo ""
          echo "APK size:"
          ls -lh "$APK"


      # =========================================================
      # 17. UPLOAD APK
      # =========================================================
      - name: Upload Test Mitra APK
        uses: actions/upload-artifact@v6
        with:
          name: Test-Mitra-APK
          path: "${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
