name: Build Test Mitra APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Test Mitra Debug APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Extract ZIP
      - name: Extract Test Mitra ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo ""
          echo "ZIP extracted successfully."

      # 3. Find React/Vite project
      - name: Find Web Project
        shell: bash
        run: |
          set -e

          PACKAGE=$(find extracted -type f -name "package.json" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Test Mitra project:"
          echo "$PROJECT_DIR"

          echo ""
          ls -la "$PROJECT_DIR"

      # 4. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # 5. Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 6. Fix Vite dependency compatibility
      - name: Fix Vite Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Installing compatible Vite version..."

          npm install \
            vite@7.2.2 \
            esbuild@0.27.0 \
            --save-dev \
            --legacy-peer-deps

          echo ""
          echo "Installed versions:"
          npm list vite esbuild @tailwindcss/vite --depth=0 || true

      # 7. Install remaining dependencies
      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm install --legacy-peer-deps

      # 8. Install Capacitor
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npm install \
            @capacitor/core@7.4.4 \
            @capacitor/android@7.4.4 \
            --legacy-peer-deps

          npm install \
            --save-dev \
            @capacitor/cli@7.4.4 \
            --legacy-peer-deps

      # 9. Build React/Vite application
      - name: Build Web Application
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Building Test Mitra..."

          npm run build

          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder was not created"
            exit 1
          fi

          echo ""
          echo "Web build successful."

          du -sh dist

      # 10. Create Capacitor configuration
      - name: Create Capacitor Configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f "capacitor.config.ts" ] && \
             [ ! -f "capacitor.config.json" ]; then

            npx cap init \
              "Test Mitra" \
              "com.testmitra.app" \
              --web-dir dist
          fi

          echo ""
          echo "Capacitor configuration:"
          ls -la capacitor.config.* 2>/dev/null || true

      # 11. Add Android platform
      - name: Add Android Platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi

      # 12. Sync Capacitor
      - name: Sync Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          npx cap sync android

      # 13. Verify Android project
      - name: Verify Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f "android/settings.gradle" ] && \
             [ ! -f "android/settings.gradle.kts" ]; then

            echo "ERROR: Android Gradle project was not created."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: Gradle wrapper was not created."
            exit 1
          fi

          echo ""
          echo "Android project verified successfully."

      # 14. Build APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 15. Verify APK
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "TEST MITRA APK GENERATED SUCCESSFULLY"
          echo "======================================"
          echo ""

          ls -lh "$APK"

      # 16. Upload APK
      - name: Upload Test Mitra APK
        uses: actions/upload-artifact@v6
        with:
          name: Test-Mitra-APK
          path: "${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
